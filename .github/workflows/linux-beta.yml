name: Linux beta background checks
on:
  push:
    branches: [codex/beta-0.12.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt-minimum:
    name: Debian 12 / Qt 6.4 / no GUI
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      GOMAXPROCS: '4'
    steps:
      - name: Install build tools and runtime libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build qt6-base-dev libqt6svg6-dev qt6-wayland libssl-dev
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Build the real private-pipe helper
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -o build/airlink-helper ./cmd/airlink
      - name: Build the desktop and logic tests without launching a GUI
        run: |
          cmake -S linux -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux -j 4
      - name: Core and real helper tests without a desktop session
        run: AIRLINK_TEST_HELPER="$PWD/build/airlink-helper" ctest --test-dir build/linux --output-on-failure
      - name: Linux-only update transaction tests
        run: go test -race ./internal/update
      - name: Check the application metadata without GUI initialization
        run: build/linux/airlink --version
      - uses: actions/upload-artifact@v6
        with:
          name: linux-beta-development-build
          path: |
            build/linux/airlink
            build/linux/airlink_core_tests
            build/airlink-helper
          retention-days: 7
