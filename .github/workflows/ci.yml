name: Background checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check publication privacy
        run: |
          python3 scripts/check-version.py
          python3 scripts/check-privacy.py --self-test
          python3 scripts/check-package-privacy.py --self-test
          python3 scripts/check-privacy.py --history
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'
      - name: Build and test the web interface
        run: |
          npm --prefix web ci
          npm --prefix web test
          npm --prefix web run build
          bash scripts/embed-web.sh
      - name: Go unit, security, HTTPS, and race tests
        run: |
          go test -race ./...
          go vet ./...
      - name: Windows core tests with the actual helper
        run: |
          mkdir -p build
          HELPER="$PWD/build/airlink-dotnet-helper"
          if [[ "$RUNNER_OS" == Windows ]]; then HELPER="$(cygpath -w "$HELPER.exe")"; fi
          CGO_ENABLED=0 go build -trimpath -o "$HELPER" ./cmd/airlink
          AIRLINK_TEST_HELPER="$HELPER" dotnet run --project windows/AirLink.Core.Tests/AirLink.Core.Tests.csproj --configuration Release
      - name: Compile portable platform binaries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis 7zip
          bash scripts/build.sh
      - name: Install Windows setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $sevenzip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $nsis) -or -not (Test-Path -LiteralPath $sevenzip)) { throw 'NSIS or 7-Zip is unavailable.' }
          "AIRLINK_NSIS=$nsis" >> $env:GITHUB_ENV
          "AIRLINK_7ZIP=$sevenzip" >> $env:GITHUB_ENV
      - name: Build native Windows setup packages
        if: runner.os == 'Windows'
        run: |
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$ARCH" go build -buildvcs=false -trimpath -ldflags='-s -w' -o "build/airlink-windows-$ARCH.exe" ./cmd/airlink
          done
          bash scripts/build-windows.sh
      - name: Create installer upgrade fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build/installer-fixture' > $null
          Set-Content -LiteralPath 'build/installer-fixture/main.go' -Encoding utf8 -Value 'package main; func main() {}'
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'; $env:CGO_ENABLED = '0'
          go build -buildvcs=false -trimpath '-ldflags=-H=windowsgui -s -w' -o build/installer-fixture/AirLink.exe build/installer-fixture/main.go
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the synthetic baseline payload.' }
          $payload = (Resolve-Path 'build/installer-fixture/AirLink.exe').Path
          $output = Join-Path (Get-Location) 'build/installer-fixture/baseline-setup.exe'
          $icon = (Resolve-Path 'windows/AirLink.Windows/Assets/AirLink.ico').Path
          & $env:AIRLINK_NSIS -V2 -INPUTCHARSET UTF8 '-DAIRLINK_VERSION=0.0.0' '-DAIRLINK_ARCH=x64' "-DAIRLINK_PAYLOAD=$payload" "-DAIRLINK_OUTPUT=$output" "-DAIRLINK_ICON=$icon" windows/installer/AirLink.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile the synthetic baseline installer.' }
      - name: Silent Windows installation, upgrade and uninstall acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-windows-installer.ps1 -InstallerPath build/windows-x64/AirLink-Setup.exe -PayloadPath build/windows-x64/AirLink.exe -ExpectedVersion (Get-Content VERSION -Raw).Trim() -BaselineInstallerPath build/installer-fixture/baseline-setup.exe -BaselinePayloadPath build/installer-fixture/AirLink.exe -BaselineVersion 0.0.0 -ReportPath build/installer-acceptance.json
      - name: Native Swift tests with the actual helper
        if: runner.os == 'macOS'
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -o build/airlink-native ./cmd/airlink
          AIRLINK_TEST_HELPER="$PWD/build/airlink-native" swift test -j 4 --package-path macos --scratch-path build/swift-tests
      - name: Compile both native macOS architectures
        if: runner.os == 'macOS'
        run: |
          swift build -j 4 --package-path macos --scratch-path build/swift-arm64 --configuration release --triple arm64-apple-macosx14.0
          swift build -j 4 --package-path macos --scratch-path build/swift-x86_64 --configuration release --triple x86_64-apple-macosx14.0
